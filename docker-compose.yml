services:
  kokuboke:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        # イメージのビルド中に cursor-agent が入らないときは
        # .env に INSTALL_CURSOR=false を書いて外す。
        INSTALL_CURSOR: ${INSTALL_CURSOR:-true}
    image: kokuboke:latest
    container_name: kokuboke
    restart: unless-stopped

    # Tailscale がホストネットワークで動いているので、ループバックにだけ出す。
    # LAN からも直接見せたい場合は "3000:3000" に変える。
    ports:
      - '127.0.0.1:3000:3000'

    volumes:
      # compose ファイルからの相対で解決される。NAS の他のコンテナもこの書き方。
      - ${DATA_PATH:-./data}:/data
      # サブスクリプションのログイン情報。消えると再ログインが要るので必ず永続化する。
      # ホームごと被せると ~/.local/bin の cursor-agent 本体が隠れるので、
      # 置き場所だけを個別に渡す。
      - claude-config:/home/app/.claude
      # cursor は二か所に分かれる。~/.cursor は設定と履歴で、
      # トークン本体は ~/.config/cursor/auth.json。後者が無いと作り直すたび再ログイン。
      - cursor-config:/home/app/.cursor
      - cursor-auth:/home/app/.config/cursor

    environment:
      TZ: Asia/Tokyo
      NODE_ENV: production
      PORT: '3000'
      DATA_DIR: /data
      USERS: ${USERS}
      CONTEXT_DAYS: '3'
      # Claude Code は 1 プロセスあたり 300〜500MB 使う。
      # 同居コンテナが増えたら減らす。
      MAX_CONCURRENT: '3'
      IMAGE_MAX_EDGE: '1568'

    # NAS の実機（N100 / 4 コア）向けの既定値。手元で試すときは .env で下げる。
    mem_limit: ${MEM_LIMIT:-2500m}
    cpus: ${CPUS:-3.0}

    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  claude-config:
  cursor-config:
  cursor-auth:
